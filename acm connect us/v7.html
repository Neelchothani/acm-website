<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Digital City — Reception</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Sora:wght@400;500;600;700&display=swap');

  :root{
    --navy-deep:#080b1a;
    --navy:#0d1230;
    --navy-panel:#131a3d;
    --neon-purple:#b14bff;
    --neon-purple-soft:#8a5cff;
    --neon-cyan:#33e7ff;
    --ink:#eef0ff;
    --ink-dim:#9aa3d1;
    --line:#2a2f5c;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    font-family:'Sora', sans-serif;
    color:var(--ink);
  }

  .page{
    position:relative;
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(177,75,255,0.22), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(51,231,255,0.10), transparent 55%),
      linear-gradient(180deg, var(--navy-deep) 0%, var(--navy) 45%, #0a0e24 100%);
    overflow:hidden;
  }

  /* ===== Intro pan scene ===== */
  .intro-scene{
    position:fixed;
    inset:0;
    z-index:50;
    overflow:hidden;
    background:#05070f;
    transition:opacity .6s ease;
  }
  .intro-scene.hide{
    opacity:0;
    pointer-events:none;
  }

  .scene-inner{
    position:absolute;
    top:0; left:0; right:0;
    height:200vh;
    transform:translateY(-100vh);
    animation:panUp 2.6s cubic-bezier(.42,0,.2,1) 0.15s forwards;
  }
  @keyframes panUp{
    0%{ transform:translateY(-100vh); }
    100%{ transform:translateY(0); }
  }

  .scene-top{ position:relative; height:100vh; overflow:hidden; }
  .scene-bottom{ position:relative; height:100vh; overflow:hidden; }

  .skyline{ position:absolute; top:0; left:0; right:0; height:60%; opacity:0.6; }
  .skyline svg{ width:100%; height:100%; display:block; }

  /* The reception artwork is a native 16:9 canvas. Size it from width so
     landscape and portrait screens never force the SVG to crop itself. */
  .desk-layer{
    position:absolute;
    left:5%;
    right:5%;
    bottom:0;
    width:90%;
    height:auto;
    aspect-ratio:16 / 9;
  }
  .desk-layer svg{ width:100%; height:100%; display:block; }

  #butlerGroup{ cursor:pointer; }
  #butlerGroup:hover{ filter:brightness(1.08); }

  .carpet-layer{ position:absolute; inset:0; }
  .carpet-layer svg{ width:100%; height:100%; display:block; }

  .tap-hint{
    position:absolute;
    left:50%; bottom:8%;
    transform:translateX(-50%);
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    letter-spacing:1px;
    font-size:15px;
    color:var(--neon-cyan);
    text-shadow:0 0 12px rgba(51,231,255,0.7);
    opacity:0;
    animation:hintFade .8s ease 2.8s forwards, hintPulse 1.8s ease-in-out 3.6s infinite;
    white-space:nowrap;
  }
  @keyframes hintFade{ to{ opacity:1; } }
  @keyframes hintPulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.45; } }

  @media (prefers-reduced-motion: reduce){
    .scene-inner{ animation:none; transform:translateY(0); }
    .tap-hint{ animation:none; opacity:1; }
  }

  /* ===== Form content ===== */
  .content{
    position:relative;
    z-index:2;
    padding:48px 20px 80px;
    opacity:0;
    transform:translateY(16px);
    pointer-events:none;
    transition:opacity .5s ease, transform .5s ease;
  }
  .content.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }

  .wrap{
    max-width:620px;
    margin:0 auto;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:34px;
  }
  .brand-mark{
    width:46px; height:46px; border-radius:10px;
    background:linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 24px rgba(177,75,255,0.55);
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:20px; color:#080b1a;
  }
  .brand-name{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.5px;
    line-height:1;
  }
  .brand-name span{ color:var(--neon-cyan); }
  .brand-sub{
    font-size:12.5px;
    color:var(--ink-dim);
    margin-top:3px;
    letter-spacing:0.3px;
  }

  .panel{
    background:linear-gradient(180deg, rgba(19,26,61,0.92), rgba(13,18,48,0.94));
    border:1px solid var(--line);
    border-radius:18px;
    padding:38px 34px 34px;
    box-shadow:
      0 0 0 1px rgba(177,75,255,0.06),
      0 30px 70px -30px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(255,255,255,0.04);
    backdrop-filter:blur(6px);
    position:relative;
  }
  .panel::before{
    content:"";
    position:absolute; top:0; left:24px; right:24px; height:1px;
    background:linear-gradient(90deg, transparent, var(--neon-purple-soft), transparent);
    opacity:0.6;
  }

  .panel-head{ margin-bottom:28px; text-align:center; }
  .panel-head h1{
    font-family:'Rajdhani', sans-serif;
    font-size:24px;
    font-weight:700;
    margin:0 0 6px;
    letter-spacing:0.3px;
  }
  .panel-head p{
    margin:0;
    font-size:14px;
    color:var(--ink-dim);
    line-height:1.5;
  }

  .field{ margin-bottom:22px; }
  .field label{
    display:block;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:9px;
    font-family:'Rajdhani', sans-serif;
    letter-spacing:0.3px;
  }
  .field label .req{ color:var(--neon-cyan); margin-left:2px; }

  .field input[type="text"],
  .field input[type="tel"],
  .field input[type="email"],
  .field select,
  .field textarea{
    width:100%;
    background:#0b1030;
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    color:var(--ink);
    font-family:'Sora', sans-serif;
    font-size:15px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input::placeholder, .field textarea::placeholder{ color:#5b6394; }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color:var(--neon-purple-soft);
    box-shadow:0 0 0 3px rgba(177,75,255,0.18);
  }
  .field textarea{ min-height:120px; resize:vertical; }

  .select-wrap{ position:relative; }
  .select-wrap::after{
    content:"";
    position:absolute; right:16px; top:50%;
    width:9px; height:9px;
    border-right:2px solid var(--neon-cyan);
    border-bottom:2px solid var(--neon-cyan);
    transform:translateY(-60%) rotate(45deg);
    pointer-events:none;
  }
  .select-wrap select{ appearance:none; cursor:pointer; }

  /* Events multi-select as toggle chips */
  .chip-grid{
    display:flex; flex-wrap:wrap; gap:10px;
  }
  .chip{ position:relative; }
  .chip input{
    position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer;
  }
  .chip span{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 16px;
    border:1px solid var(--line);
    border-radius:999px;
    font-size:13.5px;
    color:var(--ink-dim);
    background:#0b1030;
    transition:all .15s ease;
  }
  .chip span::before{
    content:"";
    width:7px; height:7px; border-radius:50%;
    background:var(--line);
    transition:all .15s ease;
  }
  .chip input:checked + span{
    color:var(--ink);
    border-color:var(--neon-purple-soft);
    background:linear-gradient(135deg, rgba(177,75,255,0.22), rgba(51,231,255,0.10));
    box-shadow:0 0 14px rgba(177,75,255,0.25);
  }
  .chip input:checked + span::before{
    background:var(--neon-cyan);
    box-shadow:0 0 6px var(--neon-cyan);
  }
  .chip input:focus-visible + span{
    outline:2px solid var(--neon-cyan);
    outline-offset:2px;
  }
  .field-hint{
    font-size:12px; color:var(--ink-dim); margin-top:8px;
  }

  .submit-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg, var(--neon-purple) 0%, var(--neon-purple-soft) 55%, var(--neon-cyan) 130%);
    color:#080b1a;
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:16.5px;
    letter-spacing:0.4px;
    cursor:pointer;
    box-shadow:0 10px 30px -8px rgba(177,75,255,0.55);
    transition:transform .12s ease, box-shadow .12s ease;
    margin-top:6px;
  }
  .submit-btn:hover{ transform:translateY(-1px); box-shadow:0 14px 34px -8px rgba(177,75,255,0.7); }
  .submit-btn:active{ transform:translateY(0); }
  .submit-btn:focus-visible{ outline:2px solid var(--neon-cyan); outline-offset:3px; }

  @media (prefers-reduced-motion: reduce){
    .submit-btn, .content{ transition:none; }
  }

  @media (max-width:480px){
    /* Portrait screens: width determines the 16:9 artwork size, so there is
       no height-driven crop of the widened composition. */
    .desk-layer{
      left:0;
      right:0;
      width:100%;
      aspect-ratio:16 / 9;
    }
    .panel{ padding:28px 20px 26px; }
    .content{ padding:32px 14px 60px; }
    .brand{ gap:10px; margin-bottom:26px; }
    .brand-mark{ width:40px; height:40px; font-size:17px; }
    .brand-name{ font-size:21px; }
    .chip span{ padding:9px 13px; font-size:12.5px; }
    .panel-head h1{ font-size:20px; }
    .tap-hint{ font-size:13px; bottom:6%; }
  }
</style>
</head>
<body>
<div class="page">

<div class="scene-inner">

<clippath id="windowClip">

<div class="content" id="formContent">
<div class="wrap">
<form class="panel">
<div class="panel-head">
<h1>Welcome to the desk</h1>
<p>Tell us who you are and how we can help — our concierge team replies within the hour.</p>
</div>
<div class="field">
<label for="name">Name <span class="req">*</span></label>
<input id="name" placeholder="Your name" required="" type="text"/>
</div>
<div class="field">
<label for="phone">Phone</label>
<input id="phone" placeholder="+91 98XXX XXXXX" type="tel"/>
</div>
<div class="field">
<label for="email">Email</label>
<input id="email" placeholder="you@example.com" type="email"/>
</div>
<div class="field">
<label for="msgtype">Message Type</label>
<div class="select-wrap">
<select id="msgtype">
<option>Enquiry</option>
<option>Booking</option>
<option>Feedback</option>
<option>Support</option>
</select>
</div>
</div>
<div class="field">
<label>Events</label>
<div class="chip-grid">
<label class="chip">
<input name="events" type="checkbox" value="rooftop-lounge"/>
<span>Rooftop Lounge Night</span>
</label>
<label class="chip">
<input name="events" type="checkbox" value="tech-summit"/>
<span>Tech Summit</span>
</label>
<label class="chip">
<input name="events" type="checkbox" value="live-dj"/>
<span>Live DJ Set</span>
</label>
<label class="chip">
<input name="events" type="checkbox" value="art-installation"/>
<span>Neon Art Installation</span>
</label>
<label class="chip">
<input name="events" type="checkbox" value="wine-tasting"/>
<span>Wine Tasting</span>
</label>
<label class="chip">
<input name="events" type="checkbox" value="business-mixer"/>
<span>Business Mixer</span>
</label>
</div>
<div class="field-hint">Select any that interest you — multiple choices welcome.</div>
</div>
<div class="field">
<label for="subject">Subject</label>
<input id="subject" placeholder="How can we help?" type="text"/>
</div>
<div class="field">
<label for="message">Message <span class="req">*</span></label>
<textarea id="message" placeholder="Tell us what you need..." required=""></textarea>
</div>
<button class="submit-btn" type="submit">Send Message</button>
</form>
</div>
</div>
</div>
<script>
  function revealForm(){
    var scene = document.getElementById('introScene');
    var form = document.getElementById('formContent');
    scene.classList.add('hide');
    form.classList.add('show');
    setTimeout(function(){
      scene.style.display = 'none';
    }, 650);
  }
</script>
